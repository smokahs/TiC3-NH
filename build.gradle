plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.0.37]'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { name 'DVS1 Maven FS'; url 'https://dvs1.progwml6.com/files/maven' } // Mantle + TConstruct
    maven { name 'ModMaven'; url 'https://modmaven.dev' }                        // JEI + fallbacks
    maven { name 'BlameJared Maven'; url 'https://maven.blamejared.com' }        // CraftTweaker / JEI
    maven { name 'Dogforce Games'; url 'https://www.dogforce-games.com/maven/' } // JSON Things (TConstruct runtime)
    maven { url 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } // Jade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}")
    implementation fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-${tinkers_version}")

    // Jade (WAILA) — compile-only, no deobf: we only call Jade's own API (MC refs resolve from the
    // deobf'd Forge/TConstruct jars). The plugin activates only when Jade is installed at runtime.
    compileOnly "maven.modrinth:jade:${jade_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_range: minecraft_range,
        forge_version: forge_version, forge_range: forge_range,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, mantle_version: mantle_version, tinkers_version: tinkers_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_name,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_name
        ])
    }
}
